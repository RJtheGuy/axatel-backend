services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DJANGO_SETTINGS_MODULE=axatel.settings.dev
      - SITE_URL=http://localhost:8001
      # Nuxt dev server is on 3000 — without it, every browser-side
      # fetch is blocked by CORS.
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - HF_HOME=/tmp/huggingface
      - HOME=/tmp
      - TMPDIR=/tmp
      - PORT=8000
    volumes:
      - .:/app
      - hf_cache:/tmp/huggingface

    ports:
      - "8001:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Must be NUXT_* — runtimeConfig ignores VITE_* entirely.
      # public = browser (host-exposed port), internal = SSR (container network).
      - NUXT_PUBLIC_API_BASE=http://localhost:8001/api/v2
      - NUXT_API_INTERNAL_BASE=http://web:8000/api/v2
    depends_on:
      - web

volumes:
  frontend_node_modules:
  hf_cache: