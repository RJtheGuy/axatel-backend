# /etc/nginx/sites-available/axatel
# After editing: sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name axatel.it www.axatel.it;
    return 301 https://axatel.it$request_uri;
}

# Redirect www → non-www (canonical URL)
server {
    listen 443 ssl http2;
    server_name www.axatel.it;
    ssl_certificate     /etc/letsencrypt/live/axatel.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axatel.it/privkey.pem;
    return 301 https://axatel.it$request_uri;
}

# Main server block
server {
    listen 443 ssl http2;
    server_name axatel.it;

    ssl_certificate     /etc/letsencrypt/live/axatel.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axatel.it/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 20M;

    # Static files — served directly by nginx, never touches Python
    # WhiteNoise already gzip-compressed them at collectstatic time
    location /static/ {
        alias /var/www/axatel/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # User uploads (images, documents)
    location /media/ {
        alias /var/www/axatel/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Everything else → gunicorn
    location / {
        proxy_pass          http://127.0.0.1:8000;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
    }
}
